# Installed as /etc/nginx/conf.d/00-vps-gateway.conf.
map $http_upgrade $vps_gateway_connection {
    default upgrade;
    '' close;
}

map $scheme $vps_gateway_forwarded_port {
    http 80;
    https 443;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / { return 444; }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate /etc/vps-gateway/default.crt;
    ssl_certificate_key /etc/vps-gateway/default.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / { return 421; }
}

include /etc/vps-gateway/sites/*.conf;
