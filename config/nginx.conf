worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
user nginx;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format gateway_json escape=json
        '{"time":"$time_iso8601","remote":"$remote_addr",'
        '"host":"$host","request":"$request","status":$status,'
        '"bytes":$body_bytes_sent,"request_time":$request_time,'
        '"upstream":"$upstream_addr","upstream_status":"$upstream_status"}';
    access_log /dev/stdout gateway_json;

    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;
    client_header_timeout 15s;
    client_body_timeout 30s;
    client_max_body_size 25m;
    keepalive_timeout 65s;

    # Docker's embedded DNS. Variable proxy_pass keeps upstreams independently
    # deployable without making an NGINX reload depend on their availability.
    resolver 127.0.0.11 valid=15s ipv6=off;

    map $http_upgrade $gateway_connection {
        default upgrade;
        '' close;
    }

    map $scheme $gateway_forwarded_port {
        http 80;
        https 443;
    }

    server {
        listen 8080 default_server;
        server_name _;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/acme;
            default_type text/plain;
        }

        location / {
            return 444;
        }
    }

    server {
        listen 8443 ssl default_server;
        server_name _;
        ssl_certificate /var/lib/vps-gateway/default.crt;
        ssl_certificate_key /var/lib/vps-gateway/default.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            return 421;
        }
    }

    include /etc/nginx/routes/*.conf;
}
