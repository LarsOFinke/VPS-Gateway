name: ${COMPOSE_PROJECT_NAME:?set COMPOSE_PROJECT_NAME in the selected runtime profile}

services:
  gateway:
    build:
      context: .
    restart: unless-stopped
    environment:
      GATEWAY_API_TOKEN: ${GATEWAY_API_TOKEN:?set GATEWAY_API_TOKEN in .env}
      GATEWAY_ADMIN_PASSWORD_HASH: ${GATEWAY_ADMIN_PASSWORD_HASH:?set GATEWAY_ADMIN_PASSWORD_HASH in .env}
      GATEWAY_API_HOST: 0.0.0.0
      GATEWAY_API_PORT: 9080
      GATEWAY_STATE_FILE: /var/lib/vps-gateway/routes.json
      GATEWAY_ADMIN_FILE: /var/lib/vps-gateway/admin.json
      GATEWAY_NGINX_FILE: /etc/vps-gateway/routes.conf
      GATEWAY_NGINX_CONFIG: /etc/nginx/nginx.conf
      GATEWAY_CERT_ROOT: /etc/letsencrypt/live
    ports:
      - "${GATEWAY_HTTP_PORT:?set GATEWAY_HTTP_PORT}:8080"
      - "${GATEWAY_HTTPS_PORT:?set GATEWAY_HTTPS_PORT}:8443"
      - "127.0.0.1:${GATEWAY_API_PORT:-9080}:9080"
    volumes:
      - gateway-state:/var/lib/vps-gateway
      - letsencrypt:/etc/letsencrypt
      - acme-webroot:/var/www/acme
    networks:
      - ingress
      - edge
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # NGINX master starts as root only to read Certbot's private keys and
      # lower its workers to the unprivileged gateway account.
      - CHOWN
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /var/log/nginx:size=16m,uid=101,gid=101
      # Generated from persistent state at every start.
      - /etc/vps-gateway:size=1m,mode=0755
    healthcheck:
      test: ["CMD", "python", "-m", "vps_gateway.healthcheck"]
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 10s

  certbot:
    image: certbot/certbot:v4.0.0
    profiles: ["tools"]
    volumes:
      - letsencrypt:/etc/letsencrypt
      - acme-webroot:/var/www/acme
    networks:
      - edge

networks:
  ingress:
    name: ${GATEWAY_INGRESS_NETWORK:?set GATEWAY_INGRESS_NETWORK}
    external: true
  edge:
    internal: false

volumes:
  gateway-state:
  letsencrypt:
  acme-webroot:
