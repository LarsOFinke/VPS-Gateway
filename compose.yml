name: ${COMPOSE_PROJECT_NAME:?set COMPOSE_PROJECT_NAME in the selected runtime profile}

services:
  gateway:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "${GATEWAY_HTTP_PORT:?set GATEWAY_HTTP_PORT}:8080"
      - "${GATEWAY_HTTPS_PORT:?set GATEWAY_HTTPS_PORT}:8443"
    volumes:
      - "${GATEWAY_ROUTES_DIR:?set GATEWAY_ROUTES_DIR}:/etc/nginx/routes:ro"
      - letsencrypt:/etc/letsencrypt:ro
      - acme-webroot:/var/www/acme:ro
    networks:
      - ingress
      - edge
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /var/cache/nginx:size=16m,uid=101,gid=101
      - /var/lib/vps-gateway:size=1m,mode=0700
    healthcheck:
      test: ["CMD", "nginx", "-t", "-c", "/etc/nginx/nginx.conf"]
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 5s

  certbot:
    image: certbot/certbot:v4.0.0
    profiles: ["tools"]
    volumes:
      - letsencrypt:/etc/letsencrypt
      - acme-webroot:/var/www/acme
    networks:
      - edge

networks:
  ingress:
    name: ${GATEWAY_INGRESS_NETWORK:?set GATEWAY_INGRESS_NETWORK}
    external: true
  edge:
    internal: false

volumes:
  letsencrypt:
  acme-webroot:
