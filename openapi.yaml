openapi: 3.1.0
info:
  title: VPS Gateway Control API
  version: 0.4.0
  description: Loopback-only API for declarative, transactional VPS ingress routing.
servers:
  - url: http://127.0.0.1:9080
security:
  - bearerAuth: []
  - adminSession: []
paths:
  /v1/admin/login:
    post:
      security: []
      operationId: adminLogin
      description: Creates an eight-hour loopback admin session. Five failed attempts trigger a 30-second cooldown.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password: {type: string}
      responses:
        '200':
          description: Authenticated; sets the HttpOnly gateway_admin cookie and returns the CSRF token.
        '401': {$ref: '#/components/responses/Unauthorized'}
  /v1/admin/session:
    get:
      security: [{adminSession: []}]
      operationId: adminSession
      responses:
        '200': {description: Current session, CSRF token, and required-password-change state.}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /v1/admin/password:
    post:
      security: [{adminSession: []}]
      operationId: changeAdminPassword
      description: Changes the password and revokes every other session. Requires X-CSRF-Token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [current_password, new_password]
              properties:
                current_password: {type: string}
                new_password: {type: string, minLength: 12, maxLength: 1024}
      responses:
        '204': {description: Password changed.}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Invalid'}
  /v1/admin/logout:
    post:
      security: [{adminSession: []}]
      operationId: adminLogout
      description: Revokes the current session. Requires X-CSRF-Token.
      responses:
        '204': {description: Session revoked and cookie expired.}
  /v1/health:
    get:
      security: []
      operationId: health
      responses:
        '200':
          description: Control plane is accepting requests.
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status: {type: string, const: ok}
                  version: {type: string}
  /v1/routes:
    get:
      operationId: listRoutes
      responses:
        '200':
          description: All configured hostname routes.
          content:
            application/json:
              schema:
                type: object
                required: [routes]
                properties:
                  routes:
                    type: array
                    items: {$ref: '#/components/schemas/Route'}
  /v1/routes/{routeId}:
    parameters:
      - $ref: '#/components/parameters/RouteId'
    get:
      operationId: getRoute
      responses:
        '200':
          description: Hostname routing declaration.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Route'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      operationId: putRoute
      description: Replaces a route declaration, validates the complete NGINX configuration, and reloads atomically.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RouteInput'}
      responses:
        '200':
          description: Existing route updated.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Route'}
        '201':
          description: Route created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Route'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
    delete:
      operationId: deleteRoute
      responses:
        '204': {description: Route deleted and NGINX reloaded.}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/routes/{routeId}/check:
    parameters:
      - $ref: '#/components/parameters/RouteId'
    post:
      operationId: checkRouteAccessibility
      description: Sends a bounded HEAD request to the validated upstream alias using the primary public hostname. Admin sessions require X-CSRF-Token.
      responses:
        '200':
          description: Accessibility result with latency and either HTTP status or a connection error.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccessibilityResult'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/reload:
    post:
      operationId: reloadGateway
      description: Revalidates routes and reloads NGINX, primarily after certificate renewal.
      responses:
        '204': {description: NGINX reloaded.}
        '409': {$ref: '#/components/responses/Conflict'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    adminSession:
      type: apiKey
      in: cookie
      name: gateway_admin
  parameters:
    RouteId:
      name: routeId
      in: path
      required: true
      schema: {type: string, pattern: '^[a-z][a-z0-9-]{0,62}$'}
  schemas:
    RouteInput:
      type: object
      additionalProperties: false
      required: [domains, upstream]
      properties:
        domains:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items: {type: string, format: hostname}
        upstream:
          type: string
          description: HTTP URL using a single Docker ingress-network alias as its host.
          pattern: '^http://[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?(?::[0-9]{1,5})?/?$'
          examples: [http://app-gateway:8080]
        tls: {type: boolean, default: false}
        websocket: {type: boolean, default: false}
        max_body_mb: {type: integer, minimum: 1, maximum: 100, default: 2}
        enabled:
          type: boolean
          default: true
          description: When false, the declared domains return a maintenance page with HTTP 503.
    Route:
      allOf:
        - type: object
          required: [id]
          properties:
            id: {type: string}
        - $ref: '#/components/schemas/RouteInput'
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [status, message]
          properties:
            status: {type: integer}
            message: {type: string}
    AccessibilityResult:
      type: object
      required: [accessible, latency_ms]
      properties:
        accessible: {type: boolean}
        latency_ms: {type: integer, minimum: 0}
        status: {type: integer, minimum: 100, maximum: 599}
        error: {type: string}
  responses:
    Unauthorized:
      description: Authentication failed or is required.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: Password rotation or a valid CSRF token is required.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: Route or endpoint not found.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: Candidate routing or NGINX reload was rejected.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Invalid:
      description: Request validation failed.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
